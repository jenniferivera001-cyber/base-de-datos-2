<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Semana 2 - Diseño</title>
  <link rel="stylesheet" href="body.css" />

  <style>
    /* ================================
        🎨 ESTILOS GENERALES
        ================================ */
    body {
      font-family: 'Poppins', "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #3498db, #2c3e50);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Indicador del rol de usuario */
    .user-name {
      position: absolute;
      top: 20px;
      right: 30px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.95rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    /* Contenedor principal estilo cristal */
    .semana-container {
      max-width: 1100px;
      width: 95%;
      margin: 80px auto 40px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.7s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .semana-header h1 {
      margin: 10px 0 5px;
      font-size: 2rem;
      font-weight: 700;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
    }

    .semana-header p {
      color: #f0f0f0;
      margin-bottom: 20px;
      font-size: 1rem;
    }

    /* Botón de retorno */
    .back-button {
      text-decoration: none;
      color: #fff;
      background: rgba(255, 255, 255, 0.25);
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }
    .back-button:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateX(-3px);
    }

    /* Botón directo a GitHub */
    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      background: #24292e;
      color: #fff;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      margin-bottom: 25px;
    }
    .github-link:hover {
      background: #0366d6;
      transform: translateY(-2px);
    }

    /* Estilos para los Acordeones de Actividades */
    details {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 18px;
      margin-bottom: 20px;
      padding: 15px 20px;
      backdrop-filter: blur(5px);
    }

    summary {
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      outline: none;
    }

    /* Cuadrícula de tarjetas dentro de cada actividad */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .preview-card {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      transition: transform 0.3s ease;
    }
    .preview-card:hover {
      transform: translateY(-5px);
    }

    .preview-window {
      width: 100%;
      height: 160px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.4);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-window iframe, 
    .preview-window img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: none;
      pointer-events: none;
    }

    .file-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-size {
      font-size: 0.75rem;
      color: #e0e0e0;
      margin-bottom: 12px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
    }

    .view-btn {
      background: rgba(255, 255, 255, 0.3);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .view-btn:hover { background: rgba(255, 255, 255, 0.5); }

    .download-btn {
      background: linear-gradient(135deg, #8e44ad, #3498db);
      color: #fff;
    }
    .download-btn:hover { background: linear-gradient(135deg, #71368a, #2980b9); }

    #loadingStatus {
      font-style: italic;
      color: #e0e0e0;
      text-align: center;
      padding: 20px;
    }

    /* ================================
        🔍 VENTANA MODAL DE PREVISUALIZACIÓN
        ================================ */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: fadeInModal 0.3s ease;
    }

    @keyframes fadeInModal {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      position: relative;
      width: 85%;
      max-width: 900px;
      height: 80vh;
      background: #1e272e;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .modal-header {
      padding: 15px 20px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .close-modal {
      background: #e74c3c;
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .close-modal:hover { background: #c0392b; }

    .modal-body {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
    }

    .modal-body iframe, 
    .modal-body img {
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <!-- Rol del usuario -->
  <div class="user-name" id="userName">Cargando...</div>

  <div class="semana-container">
    <div class="semana-header">
      <a href="tareas.html" class="back-button">← Volver a Tareas</a>

      <h1>🎨 Semana 2</h1>
      <p>Organizado en sus 3 actividades con previsualización flotante y descarga directa real</p>

      <a href="https://github.com/jenniferivera001-cyber/base-de-datos-2/tree/main/tareas%20semanales/tarea_sem2"
          target="_blank"
          class="github-link">
        🌐 Ver carpeta en GitHub
      </a>
    </div>

    <!-- Estado de carga -->
    <div id="loadingStatus">⏳ Cargando archivos de la Semana 2...</div>

    <!-- Contenedor dinámico de las 3 Actividades -->
    <div id="activitiesContainer"></div>
  </div>

  <!-- Modal flotante para Ver previsualización ampliada -->
  <div class="modal-overlay" id="previewModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalFileName">Vista Previa</span>
        <button class="close-modal" id="closeModalBtn">&times;</button>
      </div>
      <div class="modal-body" id="modalBodyContainer">
        <!-- Contenido dinámico del modal -->
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Manejo de rol
      const esAdmin = localStorage.getItem("esAdmin") === "true" || localStorage.getItem("isAdmin") === "true";
      document.getElementById("userName").textContent = esAdmin ? "Administrador" : "Invitado";

      // Elementos del modal
      const modal = document.getElementById("previewModal");
      const closeModalBtn = document.getElementById("closeModalBtn");
      const modalBody = document.getElementById("modalBodyContainer");
      const modalFileName = document.getElementById("modalFileName");

      function abrirModal(url, nombre, ext) {
        modalFileName.textContent = nombre;
        if (ext === "pdf") {
          modalBody.innerHTML = `<iframe src="${url}#toolbar=1&view=FitH" title="${nombre}"></iframe>`;
        } else if (["jpg", "jpeg", "png", "gif", "webp"].includes(ext)) {
          modalBody.innerHTML = `<img src="${url}" alt="${nombre}">`;
        } else {
          modalBody.innerHTML = `<div style="color: #000; padding: 20px; text-align: center;">Este archivo no se puede previsualizar directamente, pero puedes descargarlo.</div>`;
        }
        modal.style.display = "flex";
      }

      function cerrarModal() {
        modal.style.display = "none";
        modalBody.innerHTML = "";
      }

      closeModalBtn.addEventListener("click", cerrarModal);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) cerrarModal();
      });

      // Función para forzar descarga directa descargando el binario por fetch
      async function descargarArchivo(url, nombreArchivo) {
        try {
          const response = await fetch(url);
          const blob = await response.blob();
          const blobUrl = window.URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = blobUrl;
          link.download = nombreArchivo;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          window.URL.revokeObjectURL(blobUrl);
        } catch (e) {
          const link = document.createElement('a');
          link.href = url;
          link.target = "_blank";
          link.download = nombreArchivo;
          link.click();
        }
      }

      // Configuración de GitHub para la Semana 2
      const repoOwner = "jenniferivera001-cyber";
      const repoName = "base-de-datos-2";
      const folderPath = "tareas semanales/tarea_sem2";

      const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${encodeURIComponent(folderPath)}`;

      fetch(apiUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error("No se pudo obtener el contenido o la carpeta está vacía en GitHub.");
          }
          return response.json();
        })
        .then(data => {
          document.getElementById("loadingStatus").style.display = "none";
          const container = document.getElementById("activitiesContainer");

          const archivos = data.filter(item => item.type === "file");

          if (archivos.length === 0) {
            container.innerHTML = "<p>No hay archivos disponibles en esta carpeta.</p>";
            return;
          }

          const act1Files = [];
          const act2Files = [];
          const act3Files = [];
          const otrosFiles = [];

          archivos.forEach(archivo => {
            const nameUp = archivo.name.toUpperCase();
            // Filtro flexible adaptado a tus nombres reales (ACT 1, ACT 2, ACT 3)
            if (nameUp.includes("ACT 1") || nameUp.includes("ACT1") || nameUp.includes("ACTIVIDAD 1")) {
              act1Files.push(archivo);
            } else if (nameUp.includes("ACT 2") || nameUp.includes("ACT2") || nameUp.includes("ACTIVIDAD 2") || nameUp.includes("CAPITULO")) {
              act2Files.push(archivo);
            } else if (nameUp.includes("ACT 3") || nameUp.includes("ACT3") || nameUp.includes("ACTIVIDAD 3") || nameUp.includes("INF_")) {
              act3Files.push(archivo);
            } else {
              otrosFiles.push(archivo);
            }
          });

          if (otrosFiles.length > 0) {
            otrosFiles.forEach((f, idx) => {
              if (idx % 3 === 0) act1Files.push(f);
              else if (idx % 3 === 1) act2Files.push(f);
              else act3Files.push(f);
            });
          }

          const actividades = [
            { title: "📂 Actividad 1", files: act1Files, open: true },
            { title: "📂 Actividad 2", files: act2Files, open: false },
            { title: "📂 Actividad 3", files: act3Files, open: false }
          ];

          actividades.forEach(act => {
            if (act.files.length === 0) return;

            const details = document.createElement("details");
            if (act.open) details.setAttribute("open", "");

            const summary = document.createElement("summary");
            summary.textContent = `${act.title} (${act.files.length} archivos)`;
            details.appendChild(summary);

            const grid = document.createElement("div");
            grid.className = "cards-grid";

            act.files.forEach(archivo => {
              const card = document.createElement("div");
              card.className = "preview-card";

              const ext = archivo.name.split('.').pop().toLowerCase();
              const sizeKB = (archivo.size / 1024).toFixed(1) + " KB";

              let previewContent = "";
              if (ext === "pdf") {
                previewContent = `<iframe src="${archivo.download_url}#toolbar=0&view=FitH" title="${archivo.name}"></iframe>`;
              } else if (["jpg", "jpeg", "png", "gif", "webp"].includes(ext)) {
                previewContent = `<img src="${archivo.download_url}" alt="${archivo.name}">`;
              } else {
                previewContent = `<div style="font-size: 2.5rem; color:#333;">📄</div>`;
              }

              card.innerHTML = `
                <div class="preview-window">
                  ${previewContent}
                </div>
                <div>
                  <div class="file-title" title="${archivo.name}">${archivo.name}</div>
                  <div class="file-size">${sizeKB}</div>
                </div>
                <div class="card-actions">
                  <button class="action-btn view-btn">Ver</button>
                  <button class="action-btn download-btn">Descargar</button>
                </div>
              `;

              // Evento Ver (Abre el modal flotante)
              card.querySelector(".view-btn").addEventListener("click", () => {
                abrirModal(archivo.download_url, archivo.name, ext);
              });

              // Evento Descargar (Forzado mediante fetch blob)
              card.querySelector(".download-btn").addEventListener("click", () => {
                descargarArchivo(archivo.download_url, archivo.name);
              });

              grid.appendChild(card);
            });

            details.appendChild(grid);
            container.appendChild(details);
          });
        })
        .catch(error => {
          document.getElementById("loadingStatus").textContent = "⚠️ " + error.message;
        });
    });
  </script>
</body>
</html>
